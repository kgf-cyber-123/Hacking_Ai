<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace & Chat Application</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- সাইডবার: চ্যাট হিস্ট্রি ও নেভিগেশন -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="btn btn-primary btn-full">
          <i class="fa-solid fa-plus"></i> নতুন চ্যাট
        </button>
      </div>

      <div class="chat-history-list" id="chat-history-list">
        <!-- JS দিয়ে চ্যাট লিস্ট লোড হবে -->
      </div>

      <div class="sidebar-footer">
        <div class="user-profile" id="user-profile-section">
          <button id="auth-modal-open-btn" class="btn btn-secondary btn-full">
            <i class="fa-solid fa-right-to-bracket"></i> লগইন / সাইনআপ
          </button>
        </div>
      </div>
    </aside>

    <!-- প্রধান কন্টেন্ট এরিয়া -->
    <main class="main-content">
      <!-- টপ হেডার বার -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="sidebar-toggle-btn" class="icon-btn" title="সাইডবার টগল">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h2 id="active-chat-title">কাস্টম AI অ্যাসিস্ট্যান্ট</h2>
        </div>

        <div class="top-bar-right">
          <!-- সার্চ বাটন -->
          <button id="open-search-btn" class="icon-btn" title="মেসেজ খুঁজুন (Ctrl+Shift+F)">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>

          <!-- থিম সিলেক্টর -->
          <select id="theme-select" class="theme-dropdown">
            <option value="dark">ডার্ক থিম</option>
            <option value="light">লাইট থিম</option>
            <option value="system">সিস্টেম থিম</option>
          </select>

          <!-- এক্সপোর্ট মেনু drop-down -->
          <div class="dropdown">
            <button class="icon-btn" title="এক্সপোর্ট অপশন">
              <i class="fa-solid fa-download"></i>
            </button>
            <div class="dropdown-content">
              <button id="export-md-btn"><i class="fa-brands fa-markdown"></i> Markdown (.md)</button>
              <button id="export-txt-btn"><i class="fa-solid fa-file-lines"></i> Text (.txt)</button>
              <button id="export-html-btn"><i class="fa-solid fa-code"></i> HTML (.html)</button>
              <hr>
              <button id="backup-export-btn"><i class="fa-solid fa-box-archive"></i> ফুল ব্যাকআপ JSON</button>
            </div>
          </div>
        </div>
      </header>

      <!-- ডাইনামিক চ্যাট সার্চ বার (ডিফল্টভাবে লুকানো) -->
      <div id="search-bar-container" class="search-bar-container hidden">
        <input type="text" id="search-query-input" placeholder="চ্যাটের যেকোনো শব্দ খুঁজুন..." autocomplete="off">
        <button id="close-search-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- চ্যাট মেসেজ ডিসপ্লে এলাকা -->
      <section class="messages-container" id="messages-container">
        <!-- চ্যাট মেসেজগুলো ডাইনামিকালি রেন্ডার হবে -->
      </section>

      <!-- প্রম্পট টেমপ্লেট চিপস -->
      <div class="template-chips-container" id="template-chips-container">
        <!-- JS দিয়ে কুইক টেমপ্লেট বাটন আসবে -->
      </div>

      <!-- মেসেজ ইনপুট বার -->
      <footer class="input-container">
        <div class="input-wrapper">
          <textarea id="prompt-input" placeholder="আপনার প্রশ্ন বা প্রম্পট লিখুন... (Ctrl + Enter চাপুন)" rows="1"></textarea>
          <button id="send-prompt-btn" class="btn btn-send" title="মেসেজ পাঠান">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
        <div class="input-footer-info">
          <span>গোপন ডাটা রিস্টোর করতে: </span>
          <label for="backup-restore-input" class="file-restore-label">JSON ফাইল নির্বাচন করুন</label>
          <input type="file" id="backup-restore-input" accept=".json" style="display: none;">
        </div>
      </footer>
    </main>
  </div>

  <!-- অটেন্টিকেশন মোডাল (Login & Signup) -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="modal-close-btn" id="close-auth-modal"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="tab-header">
        <button id="tab-login-btn" class="tab-btn active">লগইন (Login)</button>
        <button id="tab-signup-btn" class="tab-btn">সাইনআপ (Signup)</button>
      </div>

      <!-- লগইন ফর্ম -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">ইমেইল বা ইউজারনেম</label>
          <input type="text" id="login-email" required placeholder="উদাহরণ: user@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">পাসওয়ার্ড</label>
          <input type="password" id="login-password" required placeholder="******">
        </div>
        <button type="submit" class="btn btn-primary btn-full">প্রবেশ করুন</button>
      </form>

      <!-- সাইনআপ ফর্ম -->
      <form id="signup-form" class="auth-form hidden">
        <div class="form-group">
          <label for="signup-username">ইউজারনেম</label>
          <input type="text" id="signup-username" required placeholder="আপনার নাম">
        </div>
        <div class="form-group">
          <label for="signup-email">ইমেইল</label>
          <input type="email" id="signup-email" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label for="signup-password">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
          <input type="password" id="signup-password" required placeholder="******">
        </div>
        <button type="submit" class="btn btn-primary btn-full">অ্যাকাউন্ট তৈরি করুন</button>
      </form>
    </div>
  </div>

  <!-- টোস্ট নোটিফিকেশন কন্টেইনার -->
  <div id="toast-container" class="toast-container"></div>

  <!-- অ্যাপ্লিকেশনের মেইন জাভাস্ক্রিপ্ট ফাইল -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
